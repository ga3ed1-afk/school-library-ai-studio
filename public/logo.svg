<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="oklch(54.1% 0.281 293.009)" />
      <stop offset="100%" stop-color="oklch(48% 0.26 290)" />
    </linearGradient>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Alex+Brush&amp;family=Cairo:wght@700;900&amp;display=swap');
      .script-font {
        font-family: 'Alex Brush', cursive, 'Brush Script MT', serif;
        font-size: 38px;
        fill: #1e1b18;
      }
      .arabic-sub {
        font-family: 'Cairo', sans-serif;
        font-size: 20px;
        font-weight: 800;
        fill: oklch(54.1% 0.281 293.009);
        letter-spacing: 0.5px;
      }
      .logo-stroke {
        fill: none;
        stroke: #12100e;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .logo-fill {
        fill: #12100e;
      }
      .accent-pixel {
        fill: oklch(54.1% 0.281 293.009);
      }
    </style>
  </defs>

  <!-- Background Soft Stone / Warm Tint -->
  <rect width="500" height="500" rx="36" fill="#F8F6F0" />
  
  <!-- Subtle border -->
  <rect x="6" y="6" width="488" height="488" rx="30" fill="none" stroke="oklch(54.1% 0.281 293.009)" stroke-opacity="0.15" stroke-width="3" />

  <g transform="translate(0, -10)">
    <!-- Monitor Bezel & Stand -->
    <!-- Stand Base -->
    <rect x="200" y="308" width="100" height="14" rx="7" class="logo-fill" />
    <!-- Stand Neck -->
    <rect x="240" y="292" width="20" height="20" rx="4" class="logo-fill" />

    <!-- Monitor Left Bracket -->
    <path d="M 160 215 L 146 215 C 138 215 132 221 132 229 L 132 284 C 132 292 138 298 146 298 L 205 298" 
          fill="none" stroke="#12100e" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Monitor Right Bracket -->
    <path d="M 340 215 L 354 215 C 362 215 368 221 368 229 L 368 284 C 368 292 362 298 354 298 L 295 298" 
          fill="none" stroke="#12100e" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Open Book Pages (Symmetrical Arching outwards) -->
    
    <!-- Central Outer Page Wings Left & Right -->
    <path d="M 244 286 C 220 280 185 270 172 178 C 205 192 235 204 246 250" 
          class="logo-stroke" stroke-width="10" />
    <path d="M 256 286 C 280 280 315 270 328 178 C 295 192 265 204 254 250" 
          class="logo-stroke" stroke-width="10" />

    <!-- Middle Page Layer -->
    <path d="M 244 294 C 205 290 168 268 156 200 C 185 208 218 220 242 270" 
          class="logo-stroke" stroke-width="8" />
    <path d="M 256 294 C 295 290 332 268 344 200 C 315 208 282 220 258 270" 
          class="logo-stroke" stroke-width="8" />

    <!-- Outer Page Base Curves -->
    <path d="M 242 300 C 190 300 148 278 142 245" 
          class="logo-stroke" stroke-width="7" />
    <path d="M 258 300 C 310 300 352 278 358 245" 
          class="logo-stroke" stroke-width="7" />

    <!-- Floating Digital Pixel Tech Blocks (Top Right) -->
    <rect x="368" y="170" width="16" height="16" rx="2" class="accent-pixel" />
    <rect x="388" y="186" width="22" height="22" rx="3" class="logo-fill" />
    <rect x="358" y="200" width="18" height="18" rx="2" class="logo-fill" />
  </g>

  <!-- French Script Typography -->
  <text x="250" y="380" text-anchor="middle" class="script-font">Librairie et Service Ben Ammar</text>

  <!-- Arabic Tagline -->
  <text x="250" y="420" text-anchor="middle" class="arabic-sub">بن عمار للمكتبية و الإعلامية</text>
</svg>
