<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <style>
      .fav-bg { fill: #F8F6F0; }
      .fav-dark { fill: #12100e; }
      .fav-stroke { fill: none; stroke: #12100e; stroke-linecap: round; stroke-linejoin: round; }
      .fav-accent { fill: oklch(54.1% 0.281 293.009); }
    </style>
  </defs>

  <rect width="128" height="128" rx="28" class="fav-bg" />
  <rect x="2" y="2" width="124" height="124" rx="26" fill="none" stroke="oklch(54.1% 0.281 293.009)" stroke-width="4" stroke-opacity="0.25" />

  <g transform="translate(14, 16) scale(0.78)">
    <!-- Stand Base -->
    <rect x="42" y="96" width="44" height="7" rx="3.5" class="fav-dark" />
    <rect x="59" y="88" width="10" height="9" rx="2" class="fav-dark" />

    <!-- Monitor Left/Right Brackets -->
    <path d="M 28 58 L 20 58 C 15 58 12 62 12 67 L 12 85 C 12 90 15 94 20 94 L 46 94" 
          fill="none" stroke="#12100e" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 100 58 L 108 58 C 113 58 116 62 116 67 L 116 85 C 116 90 113 94 108 94 L 82 94" 
          fill="none" stroke="#12100e" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Pages Wings -->
    <path d="M 61 86 C 50 82 32 75 25 35 C 41 42 56 48 62 70" 
          class="fav-stroke" stroke-width="6" />
    <path d="M 67 86 C 78 82 96 75 103 35 C 87 42 72 48 66 70" 
          class="fav-stroke" stroke-width="6" />

    <!-- Inner Pages -->
    <path d="M 61 90 C 44 88 28 76 22 45 C 34 50 48 55 60 78" 
          class="fav-stroke" stroke-width="5" />
    <path d="M 67 90 C 84 88 100 76 106 45 C 94 50 80 55 68 78" 
          class="fav-stroke" stroke-width="5" />

    <!-- Tech Pixels -->
    <rect x="106" y="28" width="8" height="8" rx="1.5" class="fav-accent" />
    <rect x="116" y="37" width="10" height="10" rx="2" class="fav-dark" />
    <rect x="102" y="44" width="8" height="8" rx="1.5" class="fav-dark" />
  </g>
</svg>
